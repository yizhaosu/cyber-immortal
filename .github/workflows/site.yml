name: 登榜与部署

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  board:
    # 只处理标题以「登榜」开头的 issue
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '登榜')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 解析灵契
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/submit.js
      - name: 保存存档
        if: hashFiles('out/status') != ''
        run: |
          if [ "$(cat out/status)" != "ok" ]; then exit 0; fi
          git config user.name "cyber-immortal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players
          git diff --cached --quiet && exit 0
          git commit -m "登榜：${{ github.event.issue.user.login }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: 回复并关闭
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file out/comment.md
          if [ "$(cat out/status)" = "ok" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi

  deploy:
    needs: board
    # push / 手动触发时 board 被跳过；登榜成功后也部署一次（机器人的提交不会再触发 push）
    if: always() && (needs.board.result == 'success' || (needs.board.result == 'skipped' && github.event_name != 'issues'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
