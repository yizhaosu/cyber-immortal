<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>赛博修仙榜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 榜单：顶部切换四个榜，下面是名次表；?u= 时显示个人主页。和游戏同一套夜色配色。 */
:root{
  --ink:#0f1222;--panel:#161a2e;--panel2:#1c2140;--line:#2b3157;
  --fg:#e9e7f2;--mute:#959bbd;--paper:#e9c46a;--cinnabar:#e5484d;--qi:#7ee0e6;--violet:#b48cff;
  --f-disp:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;min-height:100%;
  background:radial-gradient(1000px 420px at 10% -10%,rgba(126,224,230,.08),transparent 60%),radial-gradient(800px 420px at 100% 0%,rgba(229,72,77,.07),transparent 60%),var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-disp);font-weight:400;margin:0;letter-spacing:.04em;text-wrap:balance}
h1{font-size:42px;color:var(--paper);text-shadow:0 0 18px rgba(233,196,106,.3)}
a{color:var(--qi)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top p{margin:0;color:var(--mute)}
.btn{display:inline-block;text-decoration:none;font-weight:700;border-radius:6px;padding:8px 14px;background:var(--paper);color:#2a1c05;border:1px solid var(--paper)}
.btn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:6px 14px}
.tabs button[aria-selected="true"]{color:#2a1c05;background:var(--paper);border-color:var(--paper);font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--qi);outline-offset:2px}
.pane{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
td,th{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{color:var(--mute);font-weight:500;font-size:12px;letter-spacing:.08em}
.rank{font-family:var(--f-mono);font-size:18px;width:3em;color:var(--mute)}
.r1 .rank{color:var(--paper)}.r2 .rank{color:#d8dcef}.r3 .rank{color:#d49a6a}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:40px;height:40px;border-radius:50%;flex:none}
.who b{font-family:var(--f-disp);font-weight:400;font-size:18px;display:block;line-height:1.2}
.who span{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.who a{color:inherit;text-decoration:none}
.who a:hover b{color:var(--qi)}
.realm{font-family:var(--f-disp);font-size:17px;color:var(--paper)}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.val small{color:var(--mute);font-size:11px;margin-left:4px}
.empty{padding:28px 16px;color:var(--mute);text-align:center}
.note{color:var(--mute);font-size:12px;margin:0}
/* profile */
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px}
.prof img{width:150px;max-width:100%;aspect-ratio:1;border-radius:50%}
.prof h2{font-size:34px}
.prof .realm{font-size:28px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:10px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11px;color:var(--mute);letter-spacing:.1em}
.kv b{font-family:var(--f-mono);font-size:20px;font-weight:600}
.chart{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:560px){h1{font-size:34px}.prof{grid-template-columns:minmax(0,1fr)}.prof img{width:110px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h">赛博修仙榜</h1>
      <p id="sub">按真实的 AI 用量排名，数据来自各位道友提交的灵契。</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn ghost" id="backBoard" href="board.html" hidden>返回榜单</a>
      <a class="btn" href="./">去修行</a>
    </div>
  </header>

  <section id="boardView">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" style="margin-top:12px"><table><thead id="thead"></thead><tbody id="tbody"><tr><td class="empty" colspan="5">榜单加载中……</td></tr></tbody></table></div>
    <p class="note" style="margin-top:10px">榜上修为只按真实数据计算：每日 60 × √(万 Token) × (1 + 0.15 × 熬夜小时)，不含游戏里的天象、道心和渡劫。数据由本人提交，图个乐子，别太当真。</p>
  </section>

  <section id="profView" hidden></section>
  <p class="note" id="upd"></p>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const NEED=[7000,25000,63000,95000,190000,380000,600000];
function seedNum(s){s=String(s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seedNum(seed);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const avCache={};
function avatar(p,size){
  const key=p.login+'|'+p.realm+'|'+(p.yx>=100)+'|'+size;if(avCache[key])return avCache[key];
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const r=rng(p.login);const k=size/480;
  const night=p.yx>=100;const core=night?'#e5484d':'#7ee0e6';
  const bg=g.createRadialGradient(240*k,240*k,20*k,240*k,240*k,260*k);bg.addColorStop(0,night?'#3a1530':'#123a44');bg.addColorStop(1,'#0f1222');
  g.fillStyle=bg;g.fillRect(0,0,size,size);
  for(let i=0;i<=Math.min(p.realm,7);i++){g.strokeStyle=`rgba(233,196,106,${.85-i*.08})`;g.lineWidth=Math.max(1,(i?2:3)*k);g.setLineDash([(4+r()*18)*k,(3+r()*10)*k]);g.beginPath();g.arc(240*k,240*k,(118+i*15)*k,0,Math.PI*2);g.stroke()}
  g.setLineDash([]);const N=9,cs=18*k,o=240*k-N*cs/2;g.fillStyle=core;
  for(let y=0;y<N;y++)for(let x=0;x<5;x++){if(!(r()>.48||(x===4&&y>1&&y<7)))continue;g.fillRect(o+x*cs,o+y*cs,cs-1,cs-1);g.fillRect(o+(N-1-x)*cs,o+y*cs,cs-1,cs-1)}
  return avCache[key]=c.toDataURL();
}
const fmt=n=>Number(n).toLocaleString('zh-CN');
const BOARDS=[
  {id:'xw',n:'境界榜',col:'榜上修为',v:p=>p.xw,show:p=>`${fmt(p.xw)}`},
  {id:'tok',n:'焚香榜',col:'累计 Token',v:p=>p.tok,show:p=>`${fmt(p.tok)}<small>万</small>`},
  {id:'yx',n:'夜修榜',col:'夜修值',v:p=>p.yx,show:p=>`${fmt(p.yx)}<small>${p.nights} 晚</small>`},
  {id:'h',n:'幻觉榜',col:'识破幻觉',v:p=>p.h,show:p=>`${fmt(p.h)}<small>次</small>`}];
let data=null,cur='xw';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderTabs(){
  $('#tabs').innerHTML=BOARDS.map(b=>`<button role="tab" aria-selected="${b.id===cur}" data-id="${b.id}">${b.n}</button>`).join('');
}
function renderBoard(){
  renderTabs();const B=BOARDS.find(b=>b.id===cur);
  $('#thead').innerHTML=`<tr><th>名次</th><th>道友</th><th>境界</th><th>修行</th><th style="text-align:right">${B.col}</th></tr>`;
  if(!data){return}
  const list=[...data.players].sort((a,b)=>B.v(b)-B.v(a)).filter(p=>B.v(p)>0);
  if(!list.length){$('#tbody').innerHTML=`<tr><td class="empty" colspan="5">还没有道友上这个榜。在游戏里导入灵契，再点「登榜」，你就是第一位。</td></tr>`;return}
  $('#tbody').innerHTML=list.map((p,i)=>`<tr class="r${i+1}"><td class="rank">${i+1}</td>
    <td><div class="who"><img src="${avatar(p,80)}" alt=""><a href="?u=${encodeURIComponent(p.login)}"><b>${esc(p.name)}</b><span>@${esc(p.login)}</span></a></div></td>
    <td class="realm">${esc(p.realmName)}</td><td class="val">${p.days}<small>日</small></td><td class="val">${B.show(p)}</td></tr>`).join('');
}
function chart(p){
  const days=p.recent;if(!days.length)return'';
  const W=640,H=200,pl=44,pb=26,pt=10,w=(W-pl-8)/days.length;
  const max=Math.max(1,...days.map(d=>d.tok));const nice=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/nice)*nice;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 ${days.length} 个修行日的 Token 消耗">`;
  for(const t of [0,top/2,top]){s+=`<line x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="#2b3157"/><text x="${pl-6}" y="${y(t)+4}" fill="#959bbd" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">${fmt(t)}</text>`}
  days.forEach((d,i)=>{const late=Math.round(d.late)>0;const x=pl+i*w+w*.15;const bw=Math.max(2,w*.7);const yy=y(d.tok);
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,H-pb-yy).toFixed(1)}" rx="2" fill="${late?'#e5484d':'#7ee0e6'}"><title>${d.d}：${d.tok} 万 Token，对话 ${d.r} 轮${late?'，熬夜 '+d.late+' 小时':''}</title></rect>`});
  const a=days[0].d.slice(5),b=days[days.length-1].d.slice(5);
  s+=`<text x="${pl}" y="${H-6}" fill="#959bbd" font-size="11" font-family="JetBrains Mono,monospace">${a}</text><text x="${W-4}" y="${H-6}" fill="#959bbd" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">${b}</text></svg>`;
  return `<div class="chart"><h2 style="font-size:20px">近 ${days.length} 个修行日</h2>${s}<div class="legend"><span><i style="background:var(--qi)"></i>早睡的日子</span><span><i style="background:var(--cinnabar)"></i>熬夜的日子</span><span>单位：万 Token</span></div></div>`;
}
function renderProfile(login){
  const p=data&&data.players.find(x=>x.login.toLowerCase()===login.toLowerCase());
  $('#boardView').hidden=true;$('#profView').hidden=false;$('#backBoard').hidden=false;
  if(!data){$('#profView').innerHTML='<p class="note">加载中……</p>';return}
  if(!p){$('#h').textContent='查无此人';$('#sub').textContent='';$('#profView').innerHTML=`<p class="empty">@${esc(login)} 还没有登榜。</p>`;return}
  const rank=[...data.players].sort((a,b)=>b.xw-a.xw).findIndex(x=>x===p)+1;
  document.title=`${p.name} · 赛博修仙榜`;$('#h').textContent=p.name;
  $('#sub').innerHTML=`<a href="https://github.com/${encodeURIComponent(p.login)}" rel="noopener">@${esc(p.login)}</a> · 境界榜第 ${rank} 名 · 修行 ${p.days} 日（${p.first} 起）`;
  $('#profView').innerHTML=`<div class="prof"><img src="${avatar(p,480)}" alt="${esc(p.name)} 的法相"><div>
    <div class="realm">${esc(p.realmName)}</div>
    <div class="kv"><div><span>榜上修为</span><b>${fmt(p.xw)}</b></div><div><span>累计焚香</span><b>${fmt(p.tok)} 万</b></div>
    <div><span>夜修值</span><b>${fmt(p.yx)}</b></div><div><span>熬夜</span><b>${p.nights} 晚</b></div>
    <div><span>对话</span><b>${fmt(p.r)} 轮</b></div><div><span>识破幻觉</span><b>${fmt(p.h)} 次</b></div></div></div></div>${chart(p)}`;
}
function route(){const u=new URLSearchParams(location.search).get('u');if(u)renderProfile(u);else renderBoard()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.id;renderBoard()});
renderBoard();
fetch('data/leaderboard.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{data=d;
  $('#upd').textContent=`榜单更新于 ${new Date(d.updated).toLocaleString('zh-CN')}，共 ${d.players.length} 位道友。`;route()})
 .catch(()=>{data={players:[]};route();$('#upd').textContent='榜单数据暂时读不到，稍后刷新试试。'});
route();
})();
</script>
</body>
</html>
